<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Approval Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="container">
        
        <header class="header">
            <h1>Loan Approval Predictor</h1>
            <p>Enter applicant details to predict loan approval likelihood.</p>
        </header>

        <main class="card">
            <form id="loanForm" novalidate>
                
                <div class="grid">
                    
                    <div class="field">
                        <label for="Age">Age</label>
                        <input type="number" id="Age" name="Age" min="18" max="100" placeholder="e.g. 38" required>
                    </div>

                    <div class="field">
                        <label for="Gender">Gender</label>
                        <select id="Gender" name="Gender" required>
                            <option value="" disabled selected>Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="Married">Marital Status</label>
                        <select id="Married" name="Married" required>
                            <option value="" disabled selected>Select Status</option>
                            <option value="No">Single</option>
                            <option value="Yes">Married</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="Dependents">Dependents</label>
                        <select id="Dependents" name="Dependents" required>
                            <option value="" disabled selected>Select Dependents</option>
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3+">3+</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="Education">Education</label>
                        <select id="Education" name="Education" required>
                            <option value="" disabled selected>Select Education</option>
                            <option value="Graduate">Graduate</option>
                            <option value="Not Graduate">Not Graduate</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="Self_Employed">Self Employed</label>
                        <select id="Self_Employed" name="Self_Employed" required>
                            <option value="" disabled selected>Select Option</option>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="Applicant_Income">Applicant Income (Annual)</label>
                        <input type="number" id="Applicant_Income" name="Applicant_Income" min="0" step="1000" placeholder="e.g. 465,000" required>
                    </div>

                    <div class="field">
                        <label for="Coapplicant_Income">Co-applicant Income (Annual)</label>
                        <input type="number" id="Coapplicant_Income" name="Coapplicant_Income" min="0" step="1000" placeholder="e.g. 65,000 (0 if none)" required>
                    </div>

                    <div class="field">
                        <label for="Existing_Debt">Existing Debt (Total)</label>
                        <input type="number" id="Existing_Debt" name="Existing_Debt" min="0" step="1000" placeholder="e.g. 77,000 (0 if none)" required>
                    </div>

                    <div class="field">
                        <label for="Credit_Score">Credit Score</label>
                        <input type="number" id="Credit_Score" name="Credit_Score" min="300" max="850" step="1" placeholder="e.g. 657" required>
                    </div>

                    <div class="field">
                        <label for="Loan_Amount">Loan Amount</label>
                        <input type="number" id="Loan_Amount" name="Loan_Amount" min="1000" step="1000" placeholder="e.g. 204,000" required>
                    </div>

                    <div class="field">
                        <label for="Loan_Term">Loan Term (Months)</label>
                        <select id="Loan_Term" name="Loan_Term" required>
                            <option value="" disabled selected>Select Months</option>
                            <option value="36">36 Months (3 Years)</option>
                            <option value="60">60 Months (5 Years)</option>
                            <option value="84">84 Months (7 Years)</option>
                            <option value="120">120 Months (10 Years)</option>
                            <option value="180">180 Months (15 Years)</option>
                            <option value="240">240 Months (20 Years)</option>
                            <option value="300">300 Months (25 Years)</option>
                            <option value="360">360 Months (30 Years)</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="Property_Area">Property Area</label>
                        <select id="Property_Area" name="Property_Area" required>
                            <option value="" disabled selected>Select Area</option>
                            <option value="Urban">Urban</option>
                            <option value="Semiurban">Semiurban</option>
                            <option value="Rural">Rural</option>
                        </select>
                    </div>

                </div>

                <div class="actions">
                    <button type="submit" id="predictBtn" class="btn btn-primary">
                        <span class="btn-spinner" id="btnSpinner"></span>
                        <span id="btnText">Predict</span>
                    </button>
                    <button type="button" id="resetBtn" class="btn btn-secondary">Reset</button>
                </div>

            </form>

            <div id="errorAlert" class="alert" style="display: none;">
                <span id="errorMessage"></span>
            </div>

            <div id="resultCard" class="result" style="display: none;">
                <div class="result-badge" id="resultBadge">
                    <span id="resultIcon"></span>
                    <span id="resultStatus"></span>
                </div>
                <p id="resultMessage" class="result-text"></p>
                
                <div id="confidenceContainer" class="confidence-box">
                    <div class="confidence-info">
                        <span>Confidence</span>
                        <strong id="confidenceValue"></strong>
                    </div>
                    <div class="bar-bg">
                        <div id="confidenceBar" class="bar-fill"></div>
                    </div>
                </div>

                <p class="disclaimer">
                    Disclaimer: This is a machine learning prediction, not a final lending decision.
                </p>
            </div>

        </main>

        <footer class="footer">
            <p><a href="/docs" target="_blank">API Documentation</a></p>
        </footer>

    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
