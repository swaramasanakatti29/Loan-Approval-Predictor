<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Approval Predictor</title>
    <!-- Google Fonts: Merriweather for serif headings/labels, Inter for inputs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=4">
</head>
<body>

    <div class="app-container">
        
        <form id="loanForm" class="loan-form" novalidate>

            <!-- CARD 1: PERSONAL PROFILE -->
            <section class="section-card card-personal">
                <div class="card-header">
                    <svg class="card-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <h2 class="card-title">PERSONAL PROFILE</h2>
                </div>
                <div class="card-body">
                    <div class="grid-2col">
                        <!-- Row 1 -->
                        <div class="form-group">
                            <label for="Age">Age</label>
                            <input type="number" id="Age" name="Age" min="18" max="100" placeholder="e.g. 38" required>
                        </div>
                        <div class="form-group">
                            <label for="Gender">Gender</label>
                            <select id="Gender" name="Gender" required>
                                <option value="" disabled selected>Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>

                        <!-- Row 2 -->
                        <div class="form-group">
                            <label for="Married">Marital Status</label>
                            <select id="Married" name="Married" required>
                                <option value="" disabled selected>Select Status</option>
                                <option value="No">No</option>
                                <option value="Yes">Yes</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="Dependents">Dependents</label>
                            <select id="Dependents" name="Dependents" required>
                                <option value="" disabled selected>Select Dependents</option>
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3+">3+</option>
                            </select>
                        </div>

                        <!-- Row 3: Left side ~60% width -->
                        <div class="form-group col-span-60">
                            <label for="Education">Education</label>
                            <select id="Education" name="Education" required>
                                <option value="" disabled selected>Select Education</option>
                                <option value="Graduate">Graduate</option>
                                <option value="Not Graduate">Not Graduate</option>
                            </select>
                        </div>
                    </div>
                </div>
            </section>

            <!-- CARD 2: FINANCIAL ANALYSIS -->
            <section class="section-card card-financial">
                <div class="card-header">
                    <svg class="card-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15 4V2H9v2C7.34 4 6 5.34 6 7v1H4v2h2v7c0 2.21 1.79 4 4 4h4c2.21 0 4-1.79 4-4v-7h2V8h-2V7c0-1.66-1.34-3-3-3zm-3 13.5c-1.38 0-2.5-1.12-2.5-2.5h2c0 .28.22.5.5.5s.5-.22.5-.5c0-.83-1.5-.93-1.5-2 0-1.1.9-2 2-2v-.5h1v.5c1.1 0 2 .9 2 2h-2c0-.28-.22-.5-.5-.5s-.5.22-.5.5c0 .83 1.5.93 1.5 2 0 1.1-.9 2-2 2v.5h-1v-.5z"/>
                    </svg>
                    <h2 class="card-title">FINANCIAL ANALYSIS</h2>
                </div>
                <div class="card-body">
                    <div class="grid-2col">
                        <!-- Row 1 -->
                        <div class="form-group">
                            <label for="Applicant_Income">Applicant Income (Annual)</label>
                            <input type="number" id="Applicant_Income" name="Applicant_Income" min="0" step="1000" placeholder="e.g. 465,000" required>
                        </div>
                        <div class="form-group">
                            <label for="Coapplicant_Income">Co-applicant Income (Annual)</label>
                            <input type="number" id="Coapplicant_Income" name="Coapplicant_Income" min="0" step="1000" placeholder="e.g. 65,000 (0 if none)" required>
                        </div>

                        <!-- Row 2 -->
                        <div class="form-group">
                            <label for="Existing_Debt">Existing Debt (Total)</label>
                            <input type="number" id="Existing_Debt" name="Existing_Debt" min="0" step="1000" placeholder="e.g. 77,000 (0 if none)" required>
                        </div>
                        <div class="form-group">
                            <label for="Self_Employed">Self Employed</label>
                            <select id="Self_Employed" name="Self_Employed" required>
                                <option value="" disabled selected>Select Option</option>
                                <option value="No">No</option>
                                <option value="Yes">Yes</option>
                            </select>
                        </div>

                        <!-- Row 3: Left side ~60% width -->
                        <div class="form-group col-span-60">
                            <label for="Credit_Score">Credit Score</label>
                            <input type="number" id="Credit_Score" name="Credit_Score" min="300" max="850" step="1" placeholder="e.g. 657" required>
                        </div>
                    </div>
                </div>
            </section>

            <!-- CARD 3: LOAN OBJECTIVES -->
            <section class="section-card card-objectives">
                <div class="card-header">
                    <svg class="card-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                    </svg>
                    <h2 class="card-title">LOAN OBJECTIVES</h2>
                </div>
                <div class="card-body">
                    <div class="grid-2col">
                        <!-- Row 1 -->
                        <div class="form-group">
                            <label for="Loan_Amount">Loan Amount</label>
                            <input type="number" id="Loan_Amount" name="Loan_Amount" min="1000" step="1000" placeholder="e.g. 250,000" required>
                        </div>
                        <div class="form-group">
                            <label for="Loan_Term">Loan Term (Months)</label>
                            <select id="Loan_Term" name="Loan_Term" required>
                                <option value="" disabled selected>Select Months</option>
                                <option value="120">120 months (10 years)</option>
                                <option value="180">180 months (15 years)</option>
                                <option value="240">240 months (20 years)</option>
                                <option value="300">300 months (25 years)</option>
                                <option value="360">360 months (30 years)</option>
                            </select>
                        </div>

                        <!-- Row 2: Full width -->
                        <div class="form-group col-span-full">
                            <label for="Property_Area">Property Area</label>
                            <select id="Property_Area" name="Property_Area" required>
                                <option value="" disabled selected>Select Area</option>
                                <option value="Urban">Urban</option>
                                <option value="Semiurban">Semiurban</option>
                                <option value="Rural">Rural</option>
                            </select>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Centered Action Buttons with Icons -->
            <div class="form-actions-centered">
                <button type="submit" id="predictBtn" class="btn btn-navy">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M4 9h4v11H4zm6-5h4v16h-4zm6 8h4v8h-4z"/>
                    </svg>
                    <span class="btn-spinner" id="btnSpinner" aria-hidden="true"></span>
                    <span class="btn-text" id="btnText">PREDICT</span>
                </button>
                <button type="button" id="resetBtn" class="btn btn-outline-navy">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                    </svg>
                    RESET
                </button>
            </div>

        </form>

        <!-- Error Alert -->
        <div id="errorAlert" class="alert alert-error" style="display: none;" role="alert">
            <span class="alert-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></span>
            <span id="errorMessage" class="alert-text"></span>
        </div>

        <!-- Result Card -->
        <div id="resultCard" class="result-card" style="display: none;">
            <div class="result-header">
                <div id="resultBadge" class="result-badge">
                    <span id="resultIcon" class="result-icon"></span>
                    <span id="resultStatus" class="result-status"></span>
                </div>
            </div>
            <div class="result-body">
                <p id="resultMessage" class="result-message"></p>
                <div id="confidenceContainer" class="confidence-container">
                    <div class="confidence-header">
                        <span class="confidence-label">Prediction Confidence</span>
                        <span id="confidenceValue" class="confidence-value">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="confidenceBar" class="progress-bar-fill" style="width: 0%;"></div>
                    </div>
                </div>
            </div>
            <div class="result-disclaimer">
                <span class="disclaimer-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg></span>
                <span><strong>Disclaimer:</strong> This is a machine learning prediction, not a final lending decision.</span>
            </div>
        </div>

    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
